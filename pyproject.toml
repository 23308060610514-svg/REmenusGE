[project]
name = "remenusge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bcrypt>=5.0.0",
    "dotenv>=0.9.9",
    "flask>=3.1.3",
    "flet>=0.84.0",
    "mysql-connector>=2.2.9",
    "pydantic>=2.13.4",
]

[project.scripts]
#Aqui definimos el comando corto.
#Importante: Quitamos el prefijo "src." porque definiremos "src" como la raiz 
app = "main:main"

[tool.uv]
package=true

#Esta seccion es crucial para que Python vea e contenido de src como el nivel raiz 
[tool.setuptools.package-dir]
"" = "src"
